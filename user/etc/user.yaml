Name: user.rpc
ListenOn: 0.0.0.0:8081
Etcd:
  Hosts:
    - ${ETCD_HOST:127.0.0.1:2379}
  Key: user.rpc
MysqlConf:
  DataSource: ${DB_DSN}
RedisConf:
  Host: ${REDIS_HOST:127.0.0.1:6379}
  Password: ${REDIS_PASSWORD:}
  DialTimeout: 5000
  ReadTimeout: 3000
  WriteTimeout: 3000
JwtAuth:
  AccessSecret: ${JWT_SECRET:your-secret-key}
  AccessExpire: ${JWT_EXPIRE:86400}
DevServer:
  Enabled: true
